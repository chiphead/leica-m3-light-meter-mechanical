name: Gear pair axial layout audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/analyze_gear_pair_axial_layout.py"
      - ".github/workflows/gear-pair-axial-audit.yml"
      - "source/leica_m3_light_meter.stp"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gear-pair-axial-audit-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cad.txt
      - name: Install CadQuery and OpenCascade
        run: python -m pip install --disable-pip-version-check -r requirements-cad.txt
      - name: Build and audit involute gear pair
        run: python scripts/analyze_gear_pair_axial_layout.py
      - name: Commit audit report and candidate geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add working/GEAR_PAIR_AXIAL_LAYOUT_AUDIT.md
          if [ -f working/GEAR_PAIR_M05_20T_LAYOUT_CANDIDATE.step ]; then
            git add working/GEAR_PAIR_M05_20T_LAYOUT_CANDIDATE.step
          fi
          if git diff --cached --quiet; then echo "Gear layout outputs unchanged"; exit 0; fi
          git commit -m "Audit involute gear pair axial layout"
          git push origin HEAD:main
