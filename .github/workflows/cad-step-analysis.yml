name: CAD STEP geometry analysis

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "scripts/analyze_step_geometry.py"
      - "scripts/analyze_open_cover_body_relief.py"
      - "scripts/analyze_original_cover_revision.py"
      - "scripts/analyze_cover_interference_sections.py"
      - "scripts/analyze_shutter_vertical_clearance.py"
      - "scripts/analyze_shutter_multi_component_scan.py"
      - "scripts/analyze_original_cover_local_relief.py"
      - "scripts/analyze_cover_relief_topology.py"
      - "scripts/analyze_cover_body_interface.py"
      - "scripts/analyze_cover_mating_patch_removal.py"
      - "scripts/analyze_cover_vertical_removal_obstacles.py"
      - "scripts/search_cover_side_lane_bridges.py"
      - "scripts/analysis_cache.py"
      - ".github/workflows/cad-step-analysis.yml"
permissions:
  contents: write
concurrency:
  group: cad-step-analysis-main
  cancel-in-progress: false
jobs:
  analyze-step:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cad.txt
      - name: Restore CAD analysis cache
        uses: actions/cache@v4
        with:
          path: .cad-cache
          key: cad-analysis-${{ runner.os }}-py311-${{ hashFiles('requirements-cad.txt') }}-${{ github.sha }}
          restore-keys: |
            cad-analysis-${{ runner.os }}-py311-${{ hashFiles('requirements-cad.txt') }}-
      - name: Install CadQuery and OpenCascade
        run: python -m pip install --disable-pip-version-check -r requirements-cad.txt
      - name: Analyze source STEP
        run: |
          python scripts/analyze_step_geometry.py
          python scripts/analyze_original_cover_revision.py
          python scripts/analyze_cover_interference_sections.py
          python scripts/analyze_shutter_vertical_clearance.py
          python scripts/analyze_shutter_multi_component_scan.py
          python scripts/analyze_original_cover_local_relief.py
          python scripts/analyze_cover_relief_topology.py
          python scripts/analyze_cover_body_interface.py
          python scripts/analyze_cover_mating_patch_removal.py
          python scripts/analyze_cover_vertical_removal_obstacles.py
          python scripts/search_cover_side_lane_bridges.py
      - name: Commit geometry reports and candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add working/STEP_GEOMETRY_REPORT.md working/OPEN_COVER_BODY_RELIEF_REPORT.md working/ORIGINAL_COVER_REVISION_AUDIT.md working/COVER_SHUTTER_INTERFERENCE_SECTIONS.md working/SHUTTER_VERTICAL_CLEARANCE_SCAN.md working/SHUTTER_MULTI_COMPONENT_SCAN.md working/ORIGINAL_COVER_LOCAL_RELIEF_SCREEN.md working/COVER_RELIEF_TOPOLOGY_DIAGNOSTIC.md working/COVER_BODY_INTERFACE_AUDIT.md working/COVER_MATING_PATCH_AND_REMOVAL_AUDIT.md working/COVER_VERTICAL_REMOVAL_OBSTACLE_AUDIT.md working/COVER_SIDE_LANE_BRIDGE_SEARCH.md
          if find working/cover_side_lane_candidates -type f -print -quit 2>/dev/null | grep -q .; then
            git add working/cover_side_lane_candidates/
          fi
          if git diff --cached --quiet; then echo "Geometry reports unchanged"; exit 0; fi
          git commit -m "Search original cover side-lane bridge candidates"
          git push origin HEAD:main
