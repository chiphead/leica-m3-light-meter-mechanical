name: CAD STEP geometry analysis # local section and shaft-corridor sampling

on:
  push:
    branches:
      - main
    paths:
      - "source/**"
      - "scripts/analyze_step_geometry.py"
      - ".github/workflows/cad-step-analysis.yml"

permissions:
  contents: write

jobs:
  analyze-step:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cad.txt
      - name: Install CadQuery and OpenCascade
        run: python -m pip install --disable-pip-version-check -r requirements-cad.txt
      - name: Analyze source STEP
        run: python scripts/analyze_step_geometry.py
      - name: Commit geometry report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working/STEP_GEOMETRY_REPORT.md
          if git diff --cached --quiet; then
            echo "Geometry report unchanged"
            exit 0
          fi
          git commit -m "Add STEP geometry validation report"
          git pull --rebase origin main
          git push origin HEAD:main

# Dedicated CAD workflow: analyze the immutable source STEP and safely rebase the generated report.
