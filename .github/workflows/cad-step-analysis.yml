name: CAD STEP geometry analysis

on:
  push:
    branches:
      - main
    paths:
      - "source/**"
      - "scripts/analyze_step_geometry.py"
      - "scripts/analyze_open_cover_body_relief.py"
      - "scripts/analysis_cache.py"
      - ".github/workflows/cad-step-analysis.yml"

permissions:
  contents: write

concurrency:
  group: cad-step-analysis-main
  cancel-in-progress: false

jobs:
  analyze-step:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cad.txt
      - name: Restore CAD analysis cache
        uses: actions/cache@v4
        with:
          path: .cad-cache
          key: cad-analysis-${{ runner.os }}-py311-${{ hashFiles('requirements-cad.txt') }}-${{ github.sha }}
          restore-keys: |
            cad-analysis-${{ runner.os }}-py311-${{ hashFiles('requirements-cad.txt') }}-
      - name: Install CadQuery and OpenCascade
        run: python -m pip install --disable-pip-version-check -r requirements-cad.txt
      - name: Analyze source STEP
        run: |
          python scripts/analyze_step_geometry.py
          python scripts/analyze_open_cover_body_relief.py
      - name: Upload open-cover STEP and STL candidates
        uses: actions/upload-artifact@v4
        with:
          name: open-cover-cad-candidates
          path: working/open_cover_candidates/
          if-no-files-found: error
          retention-days: 14
      - name: Commit geometry reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add working/STEP_GEOMETRY_REPORT.md working/OPEN_COVER_BODY_RELIEF_REPORT.md
          if git diff --cached --quiet; then
            echo "Geometry reports unchanged"
            exit 0
          fi
          git commit -m "Add STEP geometry validation reports"
          git push origin HEAD:main
